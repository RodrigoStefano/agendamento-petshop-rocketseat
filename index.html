<!DOCTYPE html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="shortcut icon"
      href="./image/svg/favicon.svg"
      type="image/x-icon"
    />

    <link rel="stylesheet" href="./styles/index.css" />

    <title>Mundo PetShop</title>
  </head>
  <body>
    <div id="app">
      <div id="logo">
        <img src="./image/svg/logo.svg" alt="" />
      </div>

      <header>
        <div id="title">
          <h1>Sua agenda</h1>
          <p>
            Aqui você pode ver todos os clientes e serviços agendados para hoje.
          </p>
        </div>

        <div class="date-wrapper">
          <img src="./image/svg/calendar.svg" alt="Icone de calendário" />
          <input type="date" id="calendar" />
          <img
            src="./image/svg/arrow-down.svg"
            alt="Seta apontando para baixo"
            class="date-icon"
          />
        </div>
      </header>
    </div>
  </body>
</html>
